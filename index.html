<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Player</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:white;font-family:Arial}
header{padding:18px;background:#191b24;text-align:center;font-size:23px;font-weight:bold}
main{padding:15px;max-width:700px;margin:auto}
input,button{width:100%;padding:13px;margin:6px 0;border:0;border-radius:9px;font-size:15px}
input{background:#252834;color:white}
button{background:#7255ed;color:white;font-weight:bold}
button:active{opacity:.7}
#player{width:100%;margin-top:12px;background:black;border-radius:12px;overflow:hidden;aspect-ratio:16/9;position:relative}
#video,#youtube{width:100%;height:100%;border:0;object-fit:contain}
#youtube{display:none}
#placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#status{color:#aaa;text-align:center;font-size:13px;margin:12px}
#vrScreen{display:none;position:fixed;inset:0;z-index:1000;background:black}
#vrImages{display:flex;width:100%;height:100%}
.vrEye{width:50%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:black}
.vrEye video,.vrEye canvas,.vrEye iframe{width:100%;height:100%;object-fit:contain;border:0}
#exitVR{position:absolute;top:15px;left:50%;transform:translateX(-50%);width:auto;z-index:10;background:#d93636}
</style>
</head>
<body>
<header>🥽 VR PLAYER</header>
<main>
<input id="videoURL" type="url" placeholder="Вставь ссылку на видео">
<button onclick="openURL()">Открыть видео</button>
<input id="fileInput" type="file" accept="video/*">
<div id="player">
<div id="placeholder">Здесь будет видео</div>
<video id="video" playsinline controls></video>
<iframe id="youtube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</div>
<div class="controls">
<button onclick="playVideo()">▶ Играть</button>
<button onclick="pauseVideo()">⏸ Пауза</button>
<button onclick="toggleFullscreen()">⛶ На весь экран</button>
<button onclick="toggleVR()">🥽 VR режим</button>
</div>
<button onclick="stopVideo()">⏹ Остановить</button>
<div id="status">VR Player готов</div>
</main>
<div id="vrScreen">
<button id="exitVR" onclick="exitVR()">✕ Выйти из VR</button>
<div id="vrImages">
<div class="vrEye" id="leftEye"></div>
<div class="vrEye" id="rightEye"></div>
</div>
</div>
<script>
  const video=document.getElementById('video');
const youtube=document.getElementById('youtube');
const placeholder=document.getElementById('placeholder');
const statusText=document.getElementById('status');
const vrScreen=document.getElementById('vrScreen');
const leftEye=document.getElementById('leftEye');
const rightEye=document.getElementById('rightEye');

let currentType='';
let currentURL='';
let localURL='';
let vrEnabled=false;
let vrFrame=null;
let orientationEnabled=false;

function setStatus(text){
 statusText.textContent=text;
}

function getYouTubeID(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes('youtu.be')) return u.pathname.slice(1);
  if(u.searchParams.get('v')) return u.searchParams.get('v');
  const m=u.pathname.match(/\/(embed|shorts|live)\/([^/?]+)/);
  return m?m[2]:null;
 }catch(e){return null}
}

function clearPlayers(){
 video.pause();
 video.removeAttribute('src');
 video.load();
 youtube.src='';
 video.style.display='block';
 youtube.style.display='none';
 placeholder.style.display='flex';
}

function loadVideo(url){
 clearPlayers();
 currentURL=url;
 const id=getYouTubeID(url);

 if(id){
  currentType='youtube';
  video.style.display='none';
  youtube.style.display='block';
  youtube.src='https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1';
  placeholder.style.display='none';
  setStatus('Открыто видео YouTube');
 }else{
  currentType='url';
  video.src=url;
  video.style.display='block';
  youtube.style.display='none';
  placeholder.style.display='none';
  video.play().catch(()=>setStatus('Нажми Играть'));
  setStatus('Видео загружается');
 }
}

function openURL(){
 const url=document.getElementById('videoURL').value.trim();
 if(!url){setStatus('Вставь ссылку');return}
 loadVideo(url);
}

document.getElementById('fileInput').addEventListener('change',function(){
 const file=this.files[0];
 if(!file)return;
 if(localURL)URL.revokeObjectURL(localURL);
 localURL=URL.createObjectURL(file);
 currentType='file';
 currentURL=localURL;
 clearPlayers();
 video.src=localURL;
 video.style.display='block';
 placeholder.style.display='none';
 video.play().catch(()=>setStatus('Нажми Играть'));
 setStatus('Локальное видео загружено');
});
  function createVREye(container){
 container.innerHTML='';
 const canvas=document.createElement('canvas');
 canvas.width=640;
 canvas.height=480;
 container.appendChild(canvas);
 return canvas;
}

function drawVREyes(){
 if(!vrEnabled||video.readyState<2)return;

 const left=leftEye.querySelector('canvas');
 const right=rightEye.querySelector('canvas');
 if(!left||!right)return;

 const ctx1=left.getContext('2d');
 const ctx2=right.getContext('2d');

 try{
  ctx1.drawImage(video,0,0,left.width,left.height);
  ctx2.drawImage(video,0,0,right.width,right.height);
 }catch(e){}

 vrFrame=requestAnimationFrame(drawVREyes);
}

function onPhoneOrientation(event){
 if(!vrEnabled)return;

 const x=Math.max(-25,Math.min(25,event.gamma||0));
 const y=Math.max(-25,Math.min(25,event.beta||0));

 leftEye.style.transform=`translate(${x/2}px,${y/2}px)`;
 rightEye.style.transform=`translate(${-x/2}px,${-y/2}px)`;
}

async function requestMotionPermission(){
 try{
  if(typeof DeviceOrientationEvent!=='undefined'&&
     typeof DeviceOrientationEvent.requestPermission==='function'){
   const result=await DeviceOrientationEvent.requestPermission();
   if(result!=='granted')return false;
  }
  window.addEventListener('deviceorientation',onPhoneOrientation);
  orientationEnabled=true;
  return true;
 }catch(e){
  return false;
 }
    }
  async function toggleVR(){
 if(!currentType){
  setStatus('Сначала открой видео');
  return;
 }

 if(currentType!=='youtube'&&video.readyState===0){
  setStatus('Подожди загрузки видео');
  return;
 }

 vrEnabled=true;
 vrScreen.style.display='block';

 if(currentType==='youtube'){
  leftEye.innerHTML='<iframe src="'+youtube.src+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  rightEye.innerHTML='<div style="color:white;text-align:center">Для YouTube копирование изображения недоступно</div>';
 }else{
  video.pause();
  createVREye(leftEye);
  createVREye(rightEye);
  video.play().catch(()=>{});
  drawVREyes();
 }

 const motion=await requestMotionPermission();

 try{
  await vrScreen.requestFullscreen();
 }catch(e){}

 setStatus(motion?'VR включён':'VR включён без датчика движения');
}

function exitVR(){
 vrEnabled=false;
 if(vrFrame)cancelAnimationFrame(vrFrame);
 window.removeEventListener('deviceorientation',onPhoneOrientation);
 orientationEnabled=false;
 leftEye.innerHTML='';
 rightEye.innerHTML='';
 leftEye.style.transform='';
 rightEye.style.transform='';
 vrScreen.style.display='none';

 if(document.fullscreenElement){
  document.exitFullscreen().catch(()=>{});
 }
 setStatus('VR выключен');
}

function playVideo(){
 if(currentType==='youtube'){
  setStatus('Управляй YouTube через его плеер');
 }else{
  video.play().catch(()=>setStatus('Не удалось запустить видео'));
 }
}

function pauseVideo(){
 if(currentType==='youtube'){
  setStatus('Поставь видео на паузу в YouTube');
 }else{
  video.pause();
 }
}

function stopVideo(){
 if(currentType==='youtube'){
  youtube.src='';
 }else{
  video.pause();
  video.currentTime=0;
 }
 setStatus('Видео остановлено');
}

function toggleFullscreen(){
 const player=document.getElementById('player');
 if(!document.fullscreenElement){
  player.requestFullscreen?.().catch(()=>{});
 }else{
  document.exitFullscreen?.();
 }
}

video.addEventListener('ended',()=>{
 if(vrEnabled)exitVR();
});

window.addEventListener('pagehide',()=>{
 if(localURL)URL.revokeObjectURL(localURL);
});

setStatus('VR Player готов!');
</script>
</body>
</html>
