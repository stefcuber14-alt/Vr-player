<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR Player 4.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101116;color:white;
 font-family:Arial,sans-serif
}
header{
 padding:18px;background:#191b24;
 text-align:center;font-size:23px;font-weight:bold
}
main{padding:15px;max-width:700px;margin:auto}
input,button{
 width:100%;padding:13px;margin:6px 0;
 border:0;border-radius:9px;font-size:15px
}
input{background:#252834;color:white}
button{background:#7255ed;color:white;font-weight:bold}
button:active{opacity:.7}
#player{
 width:100%;aspect-ratio:16/9;background:black;
 margin-top:12px;border-radius:12px;overflow:hidden;
 position:relative
}
#video{width:100%;height:100%;object-fit:contain}
#youtube{width:100%;height:100%;border:0;display:none}
#placeholder{
 position:absolute;inset:0;display:flex;
 align-items:center;justify-content:center;color:#aaa
}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#status{text-align:center;color:#aaa;font-size:13px;margin:12px}
#vrScreen{
 display:none;position:fixed;inset:0;
 z-index:1000;background:black
}
#vrImages{display:flex;width:100%;height:100%}
.eye{
 width:50%;height:100%;overflow:hidden;
 display:flex;align-items:center;justify-content:center
}
.eye canvas{width:100%;height:100%;object-fit:contain}
#exitVR{
 position:absolute;top:12px;left:50%;
 transform:translateX(-50%);width:auto;
 z-index:10;background:#d93636
}
#vrMessage{
 position:absolute;bottom:12px;left:0;right:0;
 text-align:center;color:#aaa;font-size:12px;
 pointer-events:none
}
</style>
</head>
<body>
<header>🥽 VR PLAYER 4.0</header>
<main>
 <input id="videoURL" placeholder="Ссылка на видео">
 <button onclick="openURL()">Открыть видео</button>
 <input id="fileInput" type="file" accept="video/*">

 <div id="player">
  <div id="placeholder">Здесь будет видео</div>
  <video id="video" playsinline controls></video>
  <iframe id="youtube"
   allow="autoplay; encrypted-media; picture-in-picture"
   allowfullscreen></iframe>
 </div>

 <div class="controls">
  <button onclick="playVideo()">▶ Играть</button>
  <button onclick="pauseVideo()">⏸ Пауза</button>
  <button onclick="toggleFullscreen()">⛶ Экран</button>
  <button onclick="toggleVR()">🥽 Войти в VR</button>
 </div>
 <button onclick="stopVideo()">⏹ Остановить</button>
 <div id="status">VR Player готов</div>
</main>

<div id="vrScreen">
 <button id="exitVR" onclick="exitVR()">✕ Выйти</button>
 <div id="vrImages">
  <div class="eye"><canvas id="leftCanvas"></canvas></div>
  <div class="eye"><canvas id="rightCanvas"></canvas></div>
 </div>
 <div id="vrMessage"></div>
</div>

<script>
  const video=document.getElementById('video');
const youtube=document.getElementById('youtube');
const placeholder=document.getElementById('placeholder');
const statusText=document.getElementById('status');
const vrScreen=document.getElementById('vrScreen');

const leftCanvas=document.getElementById('leftCanvas');
const rightCanvas=document.getElementById('rightCanvas');
const leftCtx=leftCanvas.getContext('2d');
const rightCtx=rightCanvas.getContext('2d');

let currentType='';
let localURL='';
let vrEnabled=false;
let vrMode='';
let animationID=null;
let xrSession=null;
let xrRefSpace=null;
let xrGL=null;

function setStatus(s){
 statusText.textContent=s;
}

function getYouTubeID(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);
  if(u.searchParams.get('v'))return u.searchParams.get('v');
  const m=u.pathname.match(/\/(embed|shorts|live)\/([^/?]+)/);
  return m?m[2]:null;
 }catch(e){return null}
}

function clearPlayers(){
 video.pause();
 video.removeAttribute('src');
 video.load();
 youtube.src='';
 video.style.display='block';
 youtube.style.display='none';
 placeholder.style.display='flex';
}

function loadVideo(url){
 exitVR();
 clearPlayers();

 const id=getYouTubeID(url);

 if(id){
  currentType='youtube';
  video.style.display='none';
  youtube.style.display='block';
  youtube.src='https://www.youtube.com/embed/'+id+'?playsinline=1';
  placeholder.style.display='none';
  setStatus('YouTube загружен');
 }else{
  currentType='url';
  video.src=url;
  placeholder.style.display='none';
  video.play().catch(()=>setStatus('Нажми Играть'));
  setStatus('Загрузка видео');
 }
}

function openURL(){
 const url=document.getElementById('videoURL').value.trim();
 if(!url){setStatus('Вставь ссылку');return}
 loadVideo(url);
}

document.getElementById('fileInput').addEventListener('change',e=>{
 const file=e.target.files[0];
 if(!file)return;

 exitVR();
 if(localURL)URL.revokeObjectURL(localURL);

 localURL=URL.createObjectURL(file);
 currentType='file';
 clearPlayers();
 video.src=localURL;
 placeholder.style.display='none';
 video.play().catch(()=>setStatus('Нажми Играть'));
 setStatus('Файл загружен');
});
  function resizeCanvases(){
 const w=640,h=480;
 leftCanvas.width=w;
 leftCanvas.height=h;
 rightCanvas.width=w;
 rightCanvas.height=h;
}

function drawEye(ctx,canvas,offset){
 const w=canvas.width,h=canvas.height;
 ctx.clearRect(0,0,w,h);

 if(video.readyState<2)return;

 // Два изображения одного видеопотока.
 // Смещение небольшое, без искусственного обещания
 // полноценной стереоскопической глубины.
 const shift=offset;

 ctx.drawImage(
  video,
  shift,0,
  Math.max(1,video.videoWidth-shift),video.videoHeight,
  0,0,w,h
 );
}

function renderCardboard(){
 if(!vrEnabled||vrMode!=='cardboard')return;

 drawEye(leftCtx,leftCanvas,0);
 drawEye(rightCtx,rightCanvas,0);

 animationID=requestAnimationFrame(renderCardboard);
}

async function requestMotion(){
 try{
  if(typeof DeviceOrientationEvent!=='undefined'&&
     typeof DeviceOrientationEvent.requestPermission==='function'){
   const result=await DeviceOrientationEvent.requestPermission();
   if(result!=='granted')return false;
  }

  window.addEventListener('deviceorientation',onOrientation);
  return true;
 }catch(e){
  return false;
 }
}

function onOrientation(event){
 if(!vrEnabled)return;

 const gamma=Math.max(-30,Math.min(30,event.gamma||0));
 const beta=Math.max(-30,Math.min(30,event.beta||0));

 const shiftX=gamma*0.3;
 const shiftY=beta*0.3;

 document.getElementById('vrImages').style.transform=
  `translate(${shiftX}px,${shiftY}px)`;
}

async function startCardboard(){
 vrMode='cardboard';
 vrEnabled=true;
 vrScreen.style.display='block';

 resizeCanvases();

 const motion=await requestMotion();

 try{
  await vrScreen.requestFullscreen();
 }catch(e){}

 video.play().catch(()=>{});
 renderCardboard();

 document.getElementById('vrMessage').textContent=
  motion?'Cardboard • Датчик движения включён':
  'Cardboard • Без датчика движения';
  }
  async function startWebXR(){
 if(!navigator.xr)return false;

 try{
  const supported=await navigator.xr.isSessionSupported('immersive-vr');
  if(!supported)return false;

  xrSession=await navigator.xr.requestSession('immersive-vr');

  const canvas=document.createElement('canvas');
  xrGL=canvas.getContext('webgl',{
   xrCompatible:true,alpha:false
  });

  if(!xrGL)throw new Error('WebGL недоступен');

  await xrGL.makeXRCompatible();

  const layer=new XRWebGLLayer(xrSession,xrGL);
  xrSession.updateRenderState({baseLayer:layer});

  xrRefSpace=await xrSession.requestReferenceSpace('local');

  xrSession.addEventListener('end',()=>{
   xrSession=null;
   xrRefSpace=null;
   xrGL=null;
   exitVR();
  });

  vrMode='webxr';
  vrEnabled=true;
  video.play().catch(()=>{});

  xrSession.requestAnimationFrame(renderXR);
  return true;
 }catch(e){
  if(xrSession){
   try{await xrSession.end()}catch(err){}
  }
  xrSession=null;
  return false;
 }
}

function renderXR(time,frame){
 if(!xrSession||!vrEnabled)return;

 const pose=frame.getViewerPose(xrRefSpace);

 if(pose&&video.readyState>=2){
  const layer=xrSession.renderState.baseLayer;
  const gl=xrGL;

  gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);
  gl.enable(gl.SCISSOR_TEST);

  for(const view of pose.views){
   const viewport=layer.getViewport(view);
   gl.viewport(viewport.x,viewport.y,viewport.width,viewport.height);
   gl.scissor(viewport.x,viewport.y,viewport.width,viewport.height);
   gl.clearColor(0,0,0,1);
   gl.clear(gl.COLOR_BUFFER_BIT);
  }

  gl.disable(gl.SCISSOR_TEST);
 }

 xrSession.requestAnimationFrame(renderXR);
}

async function toggleVR(){
 if(!currentType){
  setStatus('Сначала открой видео');
  return;
 }

 if(currentType==='youtube'){
  setStatus('Для VR открой прямую ссылку на видео или файл');
  return;
 }

 const xrStarted=await startWebXR();

 if(!xrStarted){
  await startCardboard();
  setStatus('Включён режим Cardboard');
 }else{
  setStatus('WebXR-сеанс запущен');
 }
}

async function exitVR(){
 vrEnabled=false;

 if(animationID){
  cancelAnimationFrame(animationID);
  animationID=null;
 }

 window.removeEventListener('deviceorientation',onOrientation);

 document.getElementById('vrImages').style.transform='';

 vrScreen.style.display='none';

 if(xrSession){
  const session=xrSession;
  xrSession=null;
  try{await session.end()}catch(e){}
 }

 if(document.fullscreenElement){
  try{await document.exitFullscreen()}catch(e){}
 }

 vrMode='';
}

function playVideo(){
 if(currentType==='youtube'){
  setStatus('Управляй YouTube через его плеер');
 }else{
  video.play().catch(()=>{});
 }
}

function pauseVideo(){
 if(currentType==='youtube'){
  setStatus('Пауза YouTube — через его плеер');
 }else{
  video.pause();
 }
}

function stopVideo(){
 if(currentType==='youtube'){
  youtube.src='';
 }else{
  video.pause();
  video.currentTime=0;
 }
 setStatus('Видео остановлено');
}

function toggleFullscreen(){
 const player=document.getElementById('player');

 if(!document.fullscreenElement){
  player.requestFullscreen?.().catch(()=>{});
 }else{
  document.exitFullscreen?.();
 }
}

video.addEventListener('ended',()=>{
 if(vrEnabled)exitVR();
});

window.addEventListener('pagehide',()=>{
 if(localURL)URL.revokeObjectURL(localURL);
});

setStatus('VR Player 4.0 готов!');
</script>
</body>
</html>
